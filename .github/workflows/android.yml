
name: Build Simple Android App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Checkout BirdNET model repository
        uses: actions/checkout@v4
        with:
          repository: birdnet-team/birdnet-live-app
          ref: main
          path: birdnet-live-app
          lfs: true

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check Flutter project
        run: flutter --version

      - name: Copy BirdNET model files
        run: |
          mkdir -p assets/models

          cp birdnet-live-app/assets/models/BirdNET+_V3.0-preview3.1_Global_10K-pruned_FP16.onnx assets/models/
          cp birdnet-live-app/assets/models/BirdNET+_V3.0-preview3.1_Global_10K-pruned_Labels.csv assets/models/
          cp birdnet-live-app/assets/models/model_config.json assets/models/
          cp birdnet-live-app/assets/models/BirdNET+_V3.0-preview3.1_Global_10K-pruned_ScoreBlacklist.json assets/models/

          echo "Checking ONNX model..."
          ls -lh assets/models/

          if grep -q "version https://git-lfs.github.com/spec/v1" assets/models/BirdNET+_V3.0-preview3.1_Global_10K-pruned_FP16.onnx; then
            echo "ERROR: ONNX model is only an LFS pointer"
            exit 1
          fi

      - name: Create Android project files
        run: flutter create --platforms=android --project-name simple_android_app .

      - name: Show dependencies
        run: cat pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Verify dependencies
        run: flutter pub deps

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simple-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error


