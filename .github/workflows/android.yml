name: Build AntiCrow Android App

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Checkout BirdNET model repository
        uses: actions/checkout@v4
        with:
          repository: birdnet-team/birdnet-live-app
          ref: main
          path: birdnet-live-app
          lfs: true

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check Flutter project
        run: flutter --version

      - name: Copy BirdNET model files
        run: |
          mkdir -p assets/models

          cp birdnet-live-app/assets/models/BirdNET+_V3.0-preview3.1_Global_10K-pruned_FP16.onnx assets/models/
          cp birdnet-live-app/assets/models/BirdNET+_V3.0-preview3.1_Global_10K-pruned_Labels.csv assets/models/
          cp birdnet-live-app/assets/models/model_config.json assets/models/
          cp birdnet-live-app/assets/models/BirdNET+_V3.0-preview3.1_Global_10K-pruned_ScoreBlacklist.json assets/models/

          echo "Checking ONNX model..."
          ls -lh assets/models/

          if grep -q "version https://git-lfs.github.com/spec/v1" assets/models/BirdNET+_V3.0-preview3.1_Global_10K-pruned_FP16.onnx; then
            echo "ERROR: ONNX model is only an LFS pointer"
            exit 1
          fi

      - name: Create Android project files
        run: flutter create --platforms=android --project-name simple_android_app .

      
      - name: Set Android compile SDK
        run: |
          GRADLE="android/app/build.gradle.kts"

          if [ -f "$GRADLE" ]; then
            python3 - "$GRADLE" <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p).read()
          s, n = re.subn(r'compileSdk\s*=\s*.*', 'compileSdk = 36', s, count=1)
          if n == 0:
              s, n = re.subn(r'compileSdk\s+.*', 'compileSdk = 36', s, count=1)
          if n == 0:
              raise SystemExit("ERROR: compileSdk declaration not found")
          open(p, 'w').write(s)
          PY
          else
            GRADLE="android/app/build.gradle"
            if [ ! -f "$GRADLE" ]; then
              echo "ERROR: Gradle file not found"
              exit 1
            fi
            python3 - "$GRADLE" <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p).read()
          s, n = re.subn(r'compileSdk\s+.*', 'compileSdk 36', s, count=1)
          if n == 0:
              raise SystemExit("ERROR: compileSdk declaration not found")
          open(p, 'w').write(s)
          PY
          fi

          grep -n 'compileSdk' "$GRADLE"

     

      - name: Configure AntiCrow name and icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

          if [ ! -f assets/icon.png ]; then
            echo "ERROR: assets/icon.png not found"
            exit 1
          fi

          sed -i 's/android:label="[^"]*"/android:label="AntiCrow"/' "$MANIFEST"

          RES="android/app/src/main/res"

          # Remove adaptive icon definitions so the PNG icons below are used.
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

          # Generate launcher icons at Android's standard resolutions.
          for entry in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${entry%%:*}"
            size="${entry##*:}"

            mkdir -p "$RES/mipmap-$density"

            convert assets/icon.png \
              -resize "${size}x${size}!" \
              "$RES/mipmap-$density/ic_launcher.png"

            convert assets/icon.png \
              -resize "${size}x${size}!" \
              "$RES/mipmap-$density/ic_launcher_round.png"
          done

          echo "AntiCrow app label and launcher icons configured."
          grep 'android:label=' "$MANIFEST"

      - name: Show Android release configuration
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            cat android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            cat android/app/build.gradle
          else
            echo "ERROR: Gradle build file not found"
            exit 1
          fi

      - name: Add ONNX Runtime ProGuard rules
        run: |
          mkdir -p android/app
          echo '-keep class ai.onnxruntime.** { *; }' > android/app/proguard-rules.pro
          cat android/app/proguard-rules.pro

      - name: Show dependencies
        run: cat pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Verify dependencies
        run: flutter pub deps

      - name: Build APK
        run: |
          flutter build apk --release

          cp build/app/outputs/flutter-apk/app-release.apk AntiCrow.apk

          ls -lh AntiCrow.apk

      - name: Upload APK
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: AntiCrow-APK
          path: AntiCrow.apk
          if-no-files-found: error
          retention-days: 30

      - name: Delete previous AntiCrow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          echo "New artifact ID: $NEW_ARTIFACT_ID"

          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name == \"AntiCrow-APK\" and (.id | tostring) != \"${NEW_ARTIFACT_ID}\") | .id" |
          while read -r id; do
            if [ -n "$id" ]; then
              echo "Deleting old artifact ID: $id"
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
            fi
          done

          echo "Previous AntiCrow artifacts cleanup completed."
